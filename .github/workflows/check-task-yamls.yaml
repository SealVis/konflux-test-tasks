name: Check Tasks and Pipelines YAMLs

"on":
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kind

      - name: Set up Tekton
        uses: tektoncd/actions/setup-tektoncd@cd4768a594ec4a7af8ef72d73524a584cb564e34 # main
        with:
          pipeline_version: v1.14.0

      - name: Apply all Task YAMLs
        run: |
          set -e
          ./.github/scripts/check_task_yamls.sh
